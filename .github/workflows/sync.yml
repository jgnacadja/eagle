name: Sync Digiforma

# Planification externe de la sync catalogue : un cron in-process dans
# l'API ne tournerait que tant qu'une instance serverless est chaude.
# Déclenche POST /admin/sync (réponse 202 immédiate — le run suit en
# tâche de fond, statut via GET /admin/sync/status).
#
# Requiert :
#   - variable repo `EAGLE_API_URL` (URL publique de l'API déployée)
#   - secret repo `ADMIN_API_KEY` (même valeur que sur l'API)
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    name: Trigger catalog sync
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: POST /admin/sync
        env:
          API_URL: ${{ vars.EAGLE_API_URL }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          if [ -z "$API_URL" ]; then
            echo '::error::vars.EAGLE_API_URL is not set'
            exit 1
          fi
          if [ -z "$ADMIN_API_KEY" ]; then
            echo '::error::secrets.ADMIN_API_KEY is not set'
            exit 1
          fi
          curl -fsS -X POST "$API_URL/admin/sync" \
            -H "x-api-key: $ADMIN_API_KEY" \
            -H 'accept: application/json'
