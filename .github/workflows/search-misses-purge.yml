name: Purge search misses

# Planification externe de la purge du journal des recherches sans résultat
# (RGPD — durée de conservation bornée par SEARCH_MISS_RETENTION_DAYS) : comme
# pour la sync Digiforma, un cron in-process ne tournerait que tant qu'une
# instance serverless est chaude. Déclenche POST /admin/search-misses/purge.
#
# Requiert :
#   - variable repo `EAGLE_API_URL` (URL publique de l'API déployée)
#   - secret repo `ADMIN_API_KEY` (même valeur que sur l'API)
on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  purge:
    name: Purge expired search misses
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: POST /admin/search-misses/purge
        env:
          API_URL: ${{ vars.EAGLE_API_URL }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          if [ -z "$API_URL" ]; then
            echo '::error::vars.EAGLE_API_URL is not set'
            exit 1
          fi
          if [ -z "$ADMIN_API_KEY" ]; then
            echo '::error::secrets.ADMIN_API_KEY is not set'
            exit 1
          fi
          curl -fsS -X POST "$API_URL/admin/search-misses/purge" \
            -H "x-api-key: $ADMIN_API_KEY" \
            -H 'accept: application/json'
