name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  unit-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  # TODO(ST-10/Sprint 2): apps/front/e2e n'existe plus (domaine TaskFlow retiré).
  # Job conservé en scaffold pour la reprise des tests e2e ; désactivé pour ne
  # pas échouer sur un dossier absent.
  e2e:
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @learnup/front exec playwright install --with-deps chromium

      - name: Create .env
        run: cp .env.example .env

      - name: Start services
        run: docker compose up -d --build

      - name: Wait for services
        run: npx wait-on http://localhost:3000 http://localhost:3001/health --timeout 60000

      - name: Run e2e
        run: pnpm test:e2e

      - name: Teardown
        if: always()
        run: docker compose down
