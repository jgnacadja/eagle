sonar.projectKey=eagle
sonar.projectName=eagle

sonar.sources=apps,packages
sonar.inclusions=**/*.js,**/*.ts,**/*.vue
sonar.exclusions=**/node_modules/**,**/.nuxt/**,**/.output/**,**/dist/**,**/coverage/**,**/.turbo/**,**/*.spec.js,**/*.spec.ts,**/*.test.js,**/*.test.ts,**/eslint.config.js,**/nuxt.config.ts,**/vitest.config.ts,**/playwright.config.ts,**/vitest.setup.ts,**/i18n/**,**/mocks/**,**/plugins/**,**/tests/**,**/test/**,**/*-spec.js,**/*-spec.ts,**/*.stories.js,**/*.stories.ts

sonar.projectBaseDir=.
sonar.sourceEncoding=UTF-8

# Le quality gate est contrôlé par l'action GitHub dédiée après le scan.
sonar.javascript.lcov.reportPaths=apps/front/coverage/lcov.info,apps/api/coverage/lcov.info,apps/presence/coverage/lcov.info
